<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koi</title>
<style>
  :root { --bg: #f6f5f2; --panel: #fff; --line: #e4e1da; --text: #2b2b2b; --muted: #8a867d;
          --owner: #3b6fd8; --koi: #fff; --accent: #e67e22; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg time { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .owner { align-self: flex-end; background: var(--owner); color: #fff; }
  .owner time { color: #dfe7fb; }
  .koi { align-self: flex-start; background: var(--koi); border: 1px solid var(--line); }
  .system { align-self: center; color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; height: 44px; padding: 10px; border: 1px solid var(--line);
             border-radius: 8px; font: inherit; }
  button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--owner); color: #fff; font: inherit; cursor: pointer; }
  aside { width: 260px; border-left: 1px solid var(--line); background: var(--panel); padding: 20px; overflow-y: auto; }
  aside h2 { margin: 0 0 4px; font-size: 20px; }
  .status { color: var(--muted); margin-bottom: 16px; }
  .row { margin: 10px 0; }
  .label { font-size: 12px; color: var(--muted); }
  .bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .5s; }
  .thought { font-size: 13px; color: #555; background: #faf8f3; border-left: 3px solid var(--line);
             padding: 6px 10px; white-space: pre-wrap; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 20px; }
  .approval { border: 1px solid var(--accent); border-radius: 8px; padding: 8px; margin-top: 6px;
              font-size: 13px; word-break: break-all; }
  .approval .actions { display: flex; gap: 6px; margin-top: 6px; }
  .approval button { padding: 4px 12px; font-size: 13px; }
  .approval button.deny { background: #999; }
  .interaction { border: 1px solid var(--owner); border-radius: 8px; padding: 8px; margin-top: 6px; font-size: 13px; }
  .interaction .from { font-size: 11px; color: var(--muted); }
  .interaction .title { font-weight: 600; }
  .interaction .message { color: #555; white-space: pre-wrap; }
  .interaction img { display: block; width: 100%; max-width: 200px; margin: 6px auto; background: #fff; padding: 4px; }
  .interaction input { width: 100%; margin: 4px 0; padding: 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .interaction .actions { display: flex; gap: 6px; margin-top: 6px; }
  .interaction button { padding: 4px 12px; font-size: 13px; }
  .interaction button.deny { background: #999; }
  .interaction .expires { font-size: 11px; color: var(--muted); }
  details summary { cursor: pointer; }
  .audit { font-size: 12px; color: #555; margin-top: 4px; word-break: break-all; }
  .audit .fail { color: #c0392b; }
  @media (max-width: 720px) { aside { display: none; } .msg { max-width: 85%; } }
</style>
</head>
<body>
<section id="chat">
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="说点什么……（Enter 发送，Shift+Enter 换行）"></textarea>
    <button>发送</button>
  </form>
</section>
<aside>
  <h2 id="name">Koi</h2>
  <div class="status" id="status">连接中…</div>
  <div class="row"><span class="label">心情</span><div id="mood">-</div></div>
  <div class="row"><span class="label">精力 <span id="energy-num"></span></span>
    <div class="bar"><div id="energy" style="width:0"></div></div></div>
  <div class="row"><span class="label">对你的感觉</span><div id="affinity">-</div></div>
  <div class="row" id="thought-row" hidden><span class="label">在想</span><div class="thought" id="thought"></div></div>
  <div class="row" id="interactions-row" hidden><span class="label">等你处理</span><div id="interactions"></div></div>
  <div class="row" id="approvals-row" hidden><span class="label">等你批准</span><div id="approvals"></div></div>
  <details class="row" id="audit-box"><summary class="label">操作记录</summary><div id="audit"></div></details>
  <div class="meta" id="meta"></div>
</aside>
<script>
const STATUS = { sleeping: "睡着了", dozing: "发呆中", active: "正在想…" };
const log = document.getElementById("log");
const input = document.getElementById("input");

function fmt(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
}

function add(msg) {
  const div = document.createElement("div");
  div.className = "msg " + msg.role;
  div.textContent = msg.text;
  if (msg.role !== "system") {
    const t = document.createElement("time");
    t.textContent = fmt(msg.time);
    div.appendChild(t);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  const r = await fetch("/api/messages", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
  });
  if (!r.ok) add({ role: "system", text: "发送失败：" + r.status });
}

document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); send(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});

function affinityText(a) {
  if (a >= 0.7) return "很亲近";
  if (a >= 0.4) return "挺好的";
  if (a >= 0.1) return "有点冷淡";
  return "有情绪";
}

async function refresh() {
  try {
    const s = await (await fetch("/api/state")).json();
    const snap = s.snapshot;
    document.getElementById("name").textContent = s.name;
    document.title = s.name;
    document.getElementById("status").textContent = STATUS[snap.status] || snap.status;
    document.getElementById("mood").textContent =
      `${snap.mood_label}（效价 ${snap.emotion_v.toFixed(2)}，唤醒 ${snap.emotion_a.toFixed(2)}）`;
    document.getElementById("energy").style.width = snap.energy + "%";
    document.getElementById("energy-num").textContent = Math.round(snap.energy) + "/100";
    document.getElementById("affinity").textContent = affinityText(snap.owner_affinity);
    const row = document.getElementById("thought-row");
    row.hidden = !s.thought;
    document.getElementById("thought").textContent = s.thought || "";
    const llm = s.llm || {};
    const hit = llm.cache_hit_rate == null ? "-" : Math.round(llm.cache_hit_rate * 100) + "%";
    document.getElementById("meta").textContent =
      `LLM 调用 ${llm.calls ?? 0} 次 · 缓存命中 ${hit}`;
  } catch (e) {
    document.getElementById("status").textContent = "连接断开";
  }
}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function decide(id, approved) {
  const r = await fetch(`/api/approvals/${id}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ approved }),
  });
  if (!r.ok) add({ role: "system", text: "处理失败：" + (await r.text()) });
  refreshApprovals();
}

async function refreshApprovals() {
  try {
    const list = await (await fetch("/api/approvals")).json();
    document.getElementById("approvals-row").hidden = list.length === 0;
    document.getElementById("approvals").replaceChildren(...list.map(a => {
      const box = el("div", null, "approval");
      box.appendChild(el("div", `${a.action}：${a.detail}`));
      const actions = el("div", null, "actions");
      const ok = el("button", "批准"), no = el("button", "拒绝", "deny");
      ok.onclick = () => decide(a.id, true);
      no.onclick = () => decide(a.id, false);
      actions.append(ok, no);
      box.appendChild(actions);
      return box;
    }));
  } catch (e) {}
}

// 按 ID 增量更新，避免定时刷新把正在填的输入框清空
const cards = new Map();

async function post(url, body) {
  const r = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}),
  });
  if (!r.ok) {
    let detail = r.status;
    try { detail = (await r.json()).detail; } catch (e) {}
    add({ role: "system", text: "处理失败：" + detail });
  }
  refreshInteractions();
}

function interactionCard(a) {
  const box = el("div", null, "interaction");
  box.appendChild(el("div", `来自 ${a.plugin} 插件`, "from"));
  box.appendChild(el("div", a.title, "title"));
  box.message = box.appendChild(el("div", a.message, "message"));
  if (a.has_qr) {
    const img = el("img");
    img.src = `/api/interactions/${a.id}/qr.svg`;
    img.alt = "二维码";
    box.appendChild(img);
  }
  if (a.url && /^https?:\/\//i.test(a.url)) {
    const link = el("a", "打开链接");
    link.href = a.url; link.target = "_blank"; link.rel = "noopener noreferrer";
    box.appendChild(link);
  }
  const inputs = {};
  for (const f of a.fields) {
    const input = el("input");
    input.type = f.sensitive ? "password" : "text";
    input.placeholder = f.placeholder || f.label;
    input.autocomplete = "off";
    if (f.pattern) input.pattern = f.pattern;
    inputs[f.name] = input;
    box.appendChild(input);
  }
  const actions = el("div", null, "actions");
  if (a.kind === "form") {
    const ok = el("button", "提交");
    ok.onclick = () => {
      const values = {};
      for (const [k, v] of Object.entries(inputs)) values[k] = v.value;
      post(`/api/interactions/${a.id}`, { values });
    };
    actions.appendChild(ok);
  }
  const cancel = el("button", "取消", "deny");
  cancel.onclick = () => post(`/api/interactions/${a.id}/cancel`);
  actions.appendChild(cancel);
  box.appendChild(actions);
  box.expires = box.appendChild(el("div", "", "expires"));
  return box;
}

async function refreshInteractions() {
  try {
    const list = await (await fetch("/api/interactions")).json();
    const container = document.getElementById("interactions");
    const ids = new Set(list.map(a => a.id));
    for (const [id, card] of cards) if (!ids.has(id)) { card.remove(); cards.delete(id); }
    for (const a of list) {
      let card = cards.get(a.id);
      if (!card) { card = interactionCard(a); cards.set(a.id, card); container.appendChild(card); }
      card.message.textContent = a.message;
      const left = Math.max(0, Math.round((new Date(a.expires_at) - Date.now()) / 60000));
      card.expires.textContent = left > 0 ? `${left} 分钟内有效` : "快过期了";
    }
    document.getElementById("interactions-row").hidden = list.length === 0;
  } catch (e) {}
}

async function refreshAudit() {
  if (!document.getElementById("audit-box").open) return;
  try {
    const list = await (await fetch("/api/audit")).json();
    document.getElementById("audit").replaceChildren(...list.map(r => {
      const line = el("div", `${fmt(r.time)} ${r.plugin}.${r.capability} ${r.args}`, "audit");
      if (!r.ok) line.classList.add("fail");
      line.title = r.summary;
      return line;
    }));
  } catch (e) {}
}

document.getElementById("audit-box").addEventListener("toggle", refreshAudit);

(async () => {
  for (const m of await (await fetch("/api/history")).json()) add(m);
  new EventSource("/api/stream").onmessage = e => {
    add(JSON.parse(e.data)); refreshApprovals(); refreshInteractions();
  };
  refresh();
  refreshApprovals();
  refreshInteractions();
  setInterval(() => { refresh(); refreshApprovals(); refreshAudit(); }, 5000);
  setInterval(refreshInteractions, 2000);
})();
</script>
</body>
</html>
