# 人格参数。省略的项使用默认值，完整列表见 koi/persona/params.py。
sleep:
  circadian_peak_hour: 17.0   # 越大越晚睡晚起
  grumpiness: 0.3             # 起床气 [0, 1]
affect:
  baseline_valence: 0.2       # 平时的心情基线
  sensitivity_negative: 1.15  # 对坏事的敏感度
will:
  base: 0.4                   # 做事意愿的基线
  stubbornness: 3.0           # 坚持压力达到多少才松口
  strong_insist_limit: 2      # 主人强烈要求几次后必须照做（1–3）
mind:
  show_thoughts: true         # 状态页是否显示内心独白
